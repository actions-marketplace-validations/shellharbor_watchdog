name: Release metadata

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify version, CLI, documentation, and tag
        shell: bash
        run: bash ./scripts/release-preflight.sh "${GITHUB_REF_NAME}"
